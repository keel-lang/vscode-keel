name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Package extension
        run: npx vsce package

      - name: Upload vsix
        uses: actions/upload-artifact@v7
        with:
          name: keel-lang-vsix
          path: "*.vsix"
